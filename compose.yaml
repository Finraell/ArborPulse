services:
  analysis:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      ARBORPULSE_API_TOKEN: ${ARBORPULSE_API_TOKEN:?Set ARBORPULSE_API_TOKEN before starting}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8787
    read_only: true
    tmpfs:
      - /tmp:size=160m
    deploy:
      resources:
        limits:
          memory: 1g
