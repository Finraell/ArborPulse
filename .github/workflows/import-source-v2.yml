name: Import ArborPulse v0.2 source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract reviewed source
        env:
          EXPECTED_SHA256: "3886669287bbca01b7d74784847c5f2c876d1fa9cdebf333acec29ca271b2492"
        run: |
          python - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          import hashlib, os, zipfile
          archive = Path('arborpulse-source-v2.zip')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Source archive checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] in ('.git', '.github') or '\\' in entry.filename:
                      raise SystemExit('Unexpected archive path')
                  if entry.external_attr >> 16 & 0o170000 == 0o120000:
                      raise SystemExit('Symlinks are not accepted')
              source.extractall('.')
          archive.unlink()
          PYCODE
      - name: Commit prepared application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Upgrade ArborPulse with Meta-guided capture, grounded briefs, real footage and local key setup"
          git push origin HEAD:main
