name: Import prepared ArborPulse source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arborpulse-source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack prepared source
        env:
          EXPECTED_SHA256: a00bc6b641a9ba9677eba98ded78c30bb2c70382ea407b6b3b55a4183bbbc11a
        run: |
          python - <<'PYTHON'
          import hashlib, os, pathlib, zipfile
          archive = pathlib.Path('arborpulse-source.zip')
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Source checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  p = pathlib.PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] in {'.git', '.github'}:
                      raise SystemExit('Unexpected archive entry')
              source.extractall('.')
          archive.unlink()
          PYTHON
      - name: Commit source to the same repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Build ArborPulse inspection workspace, video engines, tests, and documentation'
          git push origin HEAD:main
